<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- NVIDIA Isaac icon: GPU/acceleration symbol with robot -->

  <!-- GPU chip representation -->
  <rect x="20" y="30" width="60" height="40" rx="4" fill="#000000" stroke="#FFD700" stroke-width="3"/>

  <!-- GPU grid/cores pattern -->
  <g id="cores" fill="#00CED1">
    <rect x="28" y="38" width="8" height="8" rx="1"/>
    <rect x="40" y="38" width="8" height="8" rx="1"/>
    <rect x="52" y="38" width="8" height="8" rx="1"/>
    <rect x="64" y="38" width="8" height="8" rx="1"/>

    <rect x="28" y="50" width="8" height="8" rx="1"/>
    <rect x="40" y="50" width="8" height="8" rx="1"/>
    <rect x="52" y="50" width="8" height="8" rx="1"/>
    <rect x="64" y="50" width="8" height="8" rx="1"/>
  </g>

  <!-- Lightning bolt for acceleration -->
  <polygon points="50,15 45,35 52,35 48,50 55,30 48,30" fill="#FFD700"/>

  <!-- Robot head silhouette on chip -->
  <g id="robot-overlay" opacity="0.6">
    <circle cx="50" cy="54" r="6" fill="#FFD700"/>
    <rect x="45" y="50" width="10" height="8" rx="2" fill="#FFD700"/>
  </g>

  <!-- Speed/performance lines -->
  <line x1="15" y1="45" x2="8" y2="45" stroke="#00CED1" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="50" x2="5" y2="50" stroke="#00CED1" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="55" x2="8" y2="55" stroke="#00CED1" stroke-width="2" stroke-linecap="round"/>

  <line x1="85" y1="45" x2="92" y2="45" stroke="#00CED1" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="50" x2="95" y2="50" stroke="#00CED1" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="55" x2="92" y2="55" stroke="#00CED1" stroke-width="2" stroke-linecap="round"/>
</svg>
