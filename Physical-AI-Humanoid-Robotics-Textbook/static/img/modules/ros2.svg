<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- ROS 2 icon: interconnected nodes/graph style -->

  <!-- Central node -->
  <circle cx="50" cy="50" r="12" fill="#FFD700" stroke="#000000" stroke-width="2"/>

  <!-- Surrounding nodes -->
  <circle cx="25" cy="25" r="8" fill="#C0C0C0" stroke="#000000" stroke-width="2"/>
  <circle cx="75" cy="25" r="8" fill="#C0C0C0" stroke="#000000" stroke-width="2"/>
  <circle cx="25" cy="75" r="8" fill="#C0C0C0" stroke="#000000" stroke-width="2"/>
  <circle cx="75" cy="75" r="8" fill="#C0C0C0" stroke="#000000" stroke-width="2"/>

  <!-- Connection lines (topics) -->
  <line x1="25" y1="25" x2="50" y2="50" stroke="#00CED1" stroke-width="3"/>
  <line x1="75" y1="25" x2="50" y2="50" stroke="#00CED1" stroke-width="3"/>
  <line x1="25" y1="75" x2="50" y2="50" stroke="#00CED1" stroke-width="3"/>
  <line x1="75" y1="75" x2="50" y2="50" stroke="#00CED1" stroke-width="3"/>

  <!-- Arrows indicating data flow -->
  <polygon points="48,42 50,38 52,42" fill="#00CED1"/>
  <polygon points="42,48 38,50 42,52" fill="#00CED1"/>
  <polygon points="58,48 62,50 58,52" fill="#00CED1"/>
  <polygon points="48,58 50,62 52,58" fill="#00CED1"/>
</svg>
