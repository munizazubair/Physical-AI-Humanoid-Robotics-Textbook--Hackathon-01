<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Digital Twin icon: robot with mirror/simulation overlay -->

  <!-- Physical robot (left side) - solid -->
  <g id="physical">
    <rect x="15" y="35" width="25" height="30" rx="3" fill="#FFD700" stroke="#000000" stroke-width="2"/>
    <circle cx="22" cy="45" r="3" fill="#000000"/>
    <circle cx="33" cy="45" r="3" fill="#000000"/>
    <rect x="20" y="55" width="15" height="3" fill="#000000"/>
  </g>

  <!-- Digital twin (right side) - wireframe/simulation -->
  <g id="digital">
    <rect x="60" y="35" width="25" height="30" rx="3" fill="none" stroke="#00CED1" stroke-width="2" stroke-dasharray="3,2"/>
    <circle cx="67" cy="45" r="3" fill="none" stroke="#00CED1" stroke-width="2"/>
    <circle cx="78" cy="45" r="3" fill="none" stroke="#00CED1" stroke-width="2"/>
    <rect x="65" y="55" width="15" height="3" fill="none" stroke="#00CED1" stroke-width="2"/>
  </g>

  <!-- Connection/sync arrows -->
  <path d="M 42 45 L 58 45" stroke="#C0C0C0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 58 55 L 42 55" stroke="#C0C0C0" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,2 5,5 0,8" fill="#C0C0C0"/>
    </marker>
  </defs>

  <!-- "Sim" label -->
  <text x="72" y="78" font-family="Arial, sans-serif" font-size="10" fill="#00CED1" font-weight="bold">SIM</text>
</svg>
